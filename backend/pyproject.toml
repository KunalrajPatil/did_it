[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Patil Kunalraj Sushil", email = "kunalraj.s.patil@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "clerk-backend-api>=7.0.0",
    "fastapi>=0.141.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "svix>=2.1.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
